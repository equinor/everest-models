# -c/--config specification:
# <REPLACE> is a REQUIRED field that needs replacing


# One or more fault, well, or polygon distance calculations.
# Datatype: [DistanceCalculation]
# Required: True
distance-calculations:
  -

    # Measure distance to a named fault.
    # Datatype: fault
    # Required: True
    type: fault

    # Optional property filter. If omitted, use all active cells.
    # Required: False
    # Default: null
    property:

      # Dynamic grid property, for example SGAS.
      # Datatype: string
      # Examples: a string value
      # Required: True
      name: <REPLACE>

      # Inclusive lower bound for selecting active cells.
      # Datatype: number
      # Required: False
      # Default: 0.0
      threshold: 0.0

      # Report date (YYYY-MM-DD). If omitted, use cells qualifying at any report.
      # Datatype: date
      # Required: False
      # Default: null
      date: null

    # Statistic over finite, positive distances: min, max, mean, or median.
    # Datatype: string
    # Required: False
    # Default: min
    aggregation: min

    # Filename for the scalar result.
    # Datatype: string
    # Examples: a string value
    # Required: True
    output: <REPLACE>

    # Non-zero factor applied to the scalar and map. Use 0.001 to convert meters to kilometers.
    # Datatype: number
    # Required: False
    # Default: 1.0
    multiplier: 1.0

    # Write a per-cell distance map; inherits the top-level verbose setting if omitted.
    # Datatype: boolean
    # Required: False
    # Default: null
    verbose: null

    # Fault name in ResInsight.
    # Datatype: string
    # Examples: a string value
    # Required: True
    name: <REPLACE>
  -

    # Measure distance to a simulation well's connected cells.
    # Datatype: well
    # Required: True
    type: well

    # Optional property filter. If omitted, use all active cells.
    # Required: False
    # Default: null
    property:

      # Dynamic grid property, for example SGAS.
      # Datatype: string
      # Examples: a string value
      # Required: True
      name: <REPLACE>

      # Inclusive lower bound for selecting active cells.
      # Datatype: number
      # Required: False
      # Default: 0.0
      threshold: 0.0

      # Report date (YYYY-MM-DD). If omitted, use cells qualifying at any report.
      # Datatype: date
      # Required: False
      # Default: null
      date: null

    # Statistic over finite, positive distances: min, max, mean, or median.
    # Datatype: string
    # Required: False
    # Default: min
    aggregation: min

    # Filename for the scalar result.
    # Datatype: string
    # Examples: a string value
    # Required: True
    output: <REPLACE>

    # Non-zero factor applied to the scalar and map. Use 0.001 to convert meters to kilometers.
    # Datatype: number
    # Required: False
    # Default: 1.0
    multiplier: 1.0

    # Write a per-cell distance map; inherits the top-level verbose setting if omitted.
    # Datatype: boolean
    # Required: False
    # Default: null
    verbose: null

    # Simulation well name in ResInsight.
    # Datatype: string
    # Examples: a string value
    # Required: True
    name: <REPLACE>
  -

    # Measure distance to an open polyline.
    # Datatype: polygon
    # Required: True
    type: polygon

    # Optional property filter. If omitted, use all active cells.
    # Required: False
    # Default: null
    property:

      # Dynamic grid property, for example SGAS.
      # Datatype: string
      # Examples: a string value
      # Required: True
      name: <REPLACE>

      # Inclusive lower bound for selecting active cells.
      # Datatype: number
      # Required: False
      # Default: 0.0
      threshold: 0.0

      # Report date (YYYY-MM-DD). If omitted, use cells qualifying at any report.
      # Datatype: date
      # Required: False
      # Default: null
      date: null

    # Statistic over finite, positive distances: min, max, mean, or median.
    # Datatype: string
    # Required: False
    # Default: min
    aggregation: min

    # Filename for the scalar result.
    # Datatype: string
    # Examples: a string value
    # Required: True
    output: <REPLACE>

    # Non-zero factor applied to the scalar and map. Use 0.001 to convert meters to kilometers.
    # Datatype: number
    # Required: False
    # Default: 1.0
    multiplier: 1.0

    # Write a per-cell distance map; inherits the top-level verbose setting if omitted.
    # Datatype: boolean
    # Required: False
    # Default: null
    verbose: null

    # At least two [easting, northing, positive-down depth] points in grid units.
    # Datatype: [[FiniteNumber, FiniteNumber, FiniteNumber]]
    # Required: True
    points:
      -   - <REPLACE>
          - <REPLACE>
          - <REPLACE>
      -   - <REPLACE>
          - <REPLACE>
          - <REPLACE>

# Default for writing per-cell maps for calculations.
# Datatype: boolean
# Choices: true, false
# Required: False
# Default: False
verbose: false
